name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # "" for a user site or custom domain, "/<repo>" for a project site.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Full site URL (custom domain once one is set), for the share-image tags.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # GitHub Pages has no SPA rewrites; serving the app as the 404 page
      # lets direct visits to /contact load the router.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
