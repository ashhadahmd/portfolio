<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <title>Ashhad Ahmed | Fintech Software Engineer</title>
    <meta name="description" content="Fintech software engineer at Toko Labs. I build Python backends, certified payment gateways, and automated systems that move money for millions of users. Case studies from Rupin and Cobu." />
    <meta name="author" content="Ashhad Ahmed" />

    <!-- VITE_SITE_URL is the live site URL, set by the deploy workflow. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Ashhad Ahmed | Fintech Software Engineer" />
    <meta property="og:description" content="Fintech software engineer at Toko Labs. I build Python backends, certified payment gateways, and automated systems that move money for millions of users. Case studies from Rupin and Cobu." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ashhad Ahmed, Fintech Software Engineer. Financial engines. Built to never fail." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {
          t = null;
        }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(t);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
